<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Marca Wishio: cutie de cadou, construita doar din forme simple
       (Imagick nu randeaza corect <path> cu contur). Lizibila la 16px. -->
  <rect width="64" height="64" rx="15" fill="#e11d48"/>

  <!-- funda: doua bucle -->
  <ellipse cx="24" cy="17" rx="9" ry="6.5" fill="#fff"/>
  <ellipse cx="40" cy="17" rx="9" ry="6.5" fill="#fff"/>
  <ellipse cx="24" cy="17" rx="3.5" ry="2.5" fill="#e11d48"/>
  <ellipse cx="40" cy="17" rx="3.5" ry="2.5" fill="#e11d48"/>

  <!-- capac si corp -->
  <rect x="9"  y="22" width="46" height="11" rx="3.5" fill="#fff"/>
  <rect x="13" y="33" width="38" height="20" rx="3.5" fill="#fff"/>

  <!-- panglica verticala, decupata din cutie -->
  <rect x="29" y="22" width="6" height="31" fill="#e11d48"/>
</svg>
